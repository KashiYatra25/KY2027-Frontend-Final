<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7FF00" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#FF3EA5" />
    </linearGradient>
  </defs>
  <!-- Dark backdrop so the mark reads at favicon sizes -->
  <rect width="40" height="40" rx="9" fill="#0A0A0F" />
  <!-- Outer dashed ring -->
  <circle cx="20" cy="20" r="18" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="4 2" />
  <!-- Inner gradient circle -->
  <circle cx="20" cy="20" r="12" fill="url(#logoGrad)" />
  <!-- K letter -->
  <text x="20" y="25" text-anchor="middle" fill="#0A0A0F" font-size="14" font-weight="900" font-family="system-ui, sans-serif">K</text>
</svg>
